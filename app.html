:root {
  --bg: #f6f6f4; --panel: #ffffff; --text: #1d1d1f; --muted: #6e6e73;
  --line: #d2d2d7; --tooth: #f0f0f0; --sel: #2f6fdf; --sel-text: #ffffff;
  --circ: #d9822b; --tri: #8a5cc7; --ok: #2e9e5b;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1c1c1e; --panel: #2c2c2e; --text: #f2f2f7; --muted: #a1a1a6;
    --line: #48484a; --tooth: #3a3a3c; --sel: #4a86f0; --sel-text: #ffffff;
    --circ: #e8973f; --tri: #a57de0; --ok: #3cbf70;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: -apple-system, "Hiragino Sans", "Yu Gothic", sans-serif;
  -webkit-user-select: none; user-select: none;
}
main { max-width: 820px; margin: 0 auto; padding: 16px; }
h1 { font-size: 20px; margin: 4px 0 12px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.langbtn { border: 1px solid var(--line); background: var(--tooth); color: var(--text); border-radius: 8px; padding: 5px 12px; font-size: 14px; cursor: pointer; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 14px; }
.modes { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.modes span { color: var(--muted); font-size: 14px; margin-right: 4px; }
.mode {
  border: 2px solid var(--line); background: var(--tooth); color: var(--text);
  border-radius: 8px; padding: 8px 14px; font-size: 15px; cursor: pointer;
}
.mode { min-width: 52px; font-size: 18px; padding: 6px 12px; }
.mode.active { border-color: var(--sel); background: var(--sel); color: var(--sel-text); }
.lbl { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
.lbl span { color: var(--muted); font-size: 13px; margin-right: 2px; }
.chip { border: 1px solid var(--line); background: var(--tooth); color: var(--text); border-radius: 14px; padding: 4px 11px; font-size: 14px; cursor: pointer; }
.chip.active { background: var(--circ); border-color: var(--circ); color: #fff; }
#label { font-size: 15px; padding: 5px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--tooth); color: var(--text); width: 9em; -webkit-user-select: text; user-select: text; }
.fmt { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; font-size: 15px; }
.fmt select { font-size: 15px; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--tooth); color: var(--text); }

.chart { display: grid; grid-template-columns: 1fr 3px 1fr; gap: 0; margin-top: 12px; }
.side { display: flex; flex-direction: column; gap: 6px; padding: 6px; }
.side.r .row { justify-content: flex-end; }
.side.l .row { justify-content: flex-start; }
.vbar { background: var(--text); }
.hbar { grid-column: 1 / -1; height: 3px; background: var(--text); }
.row { display: flex; gap: 4px; }
.t {
  width: 40px; height: 40px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--tooth); color: var(--text); font-size: 17px; font-weight: 600;
  cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0;
}
.t.p { font-size: 15px; height: 34px; color: var(--muted); }
.t.on { background: var(--sel); border-color: var(--sel); color: var(--sel-text); }
.t.on.mk { background: var(--circ); border-color: var(--circ); }
.t.on.tri { background: var(--tri); border-color: var(--tri); }
.labels { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; margin-top: 6px; }

.out {
  font-family: "Yu Gothic", "Hiragino Sans", sans-serif; font-size: 22px; line-height: 1.35;
  white-space: pre; min-height: 3.4em; padding: 10px; border-radius: 8px;
  background: var(--bg); border: 1px dashed var(--line); overflow-x: auto;
  -webkit-user-select: text; user-select: text;
}
.out u { text-decoration-thickness: 1px; text-underline-offset: 6px; }
.out.font { font-family: "ShishikiCross", "Hiragino Sans", sans-serif; font-size: 40px; line-height: 1.3; }
.out.empty { color: var(--muted); font-size: 15px; }
.actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.btn { border: none; border-radius: 8px; padding: 12px 20px; font-size: 16px; cursor: pointer; }
.btn.copy { background: var(--sel); color: #fff; font-weight: 600; }
.btn.copy.done { background: var(--ok); }
.btn.clear { background: var(--tooth); color: var(--text); border: 1px solid var(--line); }
.hint { color: var(--muted); font-size: 13px; margin-top: 8px; line-height: 1.6; }

@media (max-width: 760px) {
  .t { width: 30px; height: 34px; font-size: 15px; border-radius: 6px; }
  .t.p { height: 30px; font-size: 13px; }
  .row { gap: 3px; }
  .side { padding: 4px; }
}
@media (max-width: 600px) {
  .t { width: 20px; height: 32px; font-size: 13px; border-radius: 4px; }
  .t.p { font-size: 12px; }
  .row { gap: 2px; }
  .side { padding: 3px 2px; }
}
</style>
</head>
<body>
<main>
  <div class="top"><h1>歯式forMac <small style="font-size:12px;color:var(--muted);font-weight:400">v1.2</small></h1><button class="langbtn" id="lang">English</button></div>

  <div class="panel">
    <div class="modes">
      <span data-i18n="marks">歯の印：</span>
      <button class="mode active" data-mode="0" data-i18n-title="m0" title="そのまま">６</button>
      <button class="mode" data-mode="1" data-i18n-title="m1" title="丸（ブリッジ支台歯など）">⑥</button>
      <button class="mode" data-mode="2" data-i18n-title="m2" title="二重丸">◎</button>
      <button class="mode" data-mode="3" data-i18n-title="m3" title="丸に縦線">⦶</button>
      <button class="mode" data-mode="4" data-i18n-title="m4" title="丸にバツ">⊗</button>
      <button class="mode" data-mode="5" data-i18n-title="m5" title="三角">△</button>
    </div>

    <div class="chart" id="chart"></div>
    <div class="labels"><span data-i18n="right">← 患者の右</span><span data-i18n="left">患者の左 →</span></div>

    <div class="lbl" id="chips1"><span data-i18n="chips1">前に付ける：</span></div>
    <div class="lbl" id="chips2"><span data-i18n="chips2">傷病名など：</span></div>
    <div class="lbl"><span data-i18n="free">自由入力：</span><input id="label" data-i18n-ph="freeph" placeholder="例：C2"></div>
  </div>

  <div class="panel">
    <div class="fmt"><span data-i18n="format">形式：</span>
      <select id="fmt">
        <option value="f" data-i18n="ff">専用フォント1行（十字）</option>
        <option value="2" data-i18n="f2">Excel用2行（上の段に下線）</option>
        <option value="1" data-i18n="f1">テキスト1行（６５┘└４）</option>
        <option value="3" data-i18n="f3">テキスト十字3行</option>
      </select>
    </div>
    <div class="out empty" id="out">歯を選ぶとここに表示されます</div>
    <div class="actions">
      <button class="btn copy" id="copy" data-i18n="copy">コピー</button>
      <button class="btn clear" id="next" data-i18n="next">次の歯式へ</button>
      <button class="btn clear" id="clear" data-i18n-title="clear" title="今選んでいる歯とラベルだけ消す">C</button>
      <button class="btn clear" id="allclear" data-i18n-title="allclear" title="全部消す">AC</button>
    </div>
    <div class="hint" data-i18n-html="hint">
      「専用フォント」形式は、同じフォルダの <b>ShishikiCross.ttf</b> をMacにインストールしておくと、Excelのセルに1行の十字で表示されます。<br>
      使い方：印を選んでから歯を押します（同じ印でもう一度押すと取り消し）。「次の歯式へ」で、続けて別の歯式を並べられます。
    </div>
  </div>
  <p style="text-align:center;font-size:12px;color:var(--muted)">© 2026 Uni20260227 ・ <a href="https://uni20260227.github.io/shishiki-for-mac/terms.html" target="_blank" rel="noopener" style="color:inherit">利用規約 / Terms</a> ・ <a href="https://uni20260227.github.io/shishiki-for-mac/" target="_blank" rel="noopener" style="color:inherit">uni20260227.github.io/shishiki-for-mac</a></p>
</main>

<script>
// 状態: key = "UR-p-6"（象限-永久歯p/乳歯d-番号）, 値 = 印の番号
//   0=そのまま 1=○ 2=◎ 3=⦶ 4=⊗ 5=△
let state = {};
let label = '';
let mode = 0;
const groups = []; // 確定した歯式 {state, label}

const PERM = [1, 2, 3, 4, 5, 6, 7, 8];
const PRIM = [1, 2, 3, 4, 5]; // A〜E
const CHIPS = {
  ja: [['残', '欠', 'Br', 'P', '部'], ['C', 'Pul', 'Per', 'G', 'Hys', 'WSD', 'MT', 'FMC', 'CR', 'In', 'PD', 'FD', '抜歯']],
  en: [['Br', 'Crown', 'Ext', 'Missing', 'RCT'], ['Caries', 'Perio', 'Implant', 'Filling', 'Veneer', 'Denture', 'Ortho']],
};
const I18N = {
  ja: {
    marks: '歯の印：', m0: 'そのまま', m1: '丸（ブリッジ支台歯など）', m2: '二重丸', m3: '丸に縦線', m4: '丸にバツ', m5: '三角',
    right: '← 患者の右', left: '患者の左 →', chips1: '前に付ける：', chips2: '傷病名など：', free: '自由入力：', freeph: '例：C2',
    format: '形式：', ff: '専用フォント1行（十字）', f2: 'Excel用2行（上の段に下線）', f1: 'テキスト1行（６５┘└４）', f3: 'テキスト十字3行',
    copy: 'コピー', copied: 'コピーしました', next: '次の歯式へ', clear: '今選んでいる歯とラベルだけ消す', allclear: '全部消す',
    empty: '歯を選ぶとここに表示されます', lang: 'English',
    quads: { UR: '右上', UL: '左上', LR: '右下', LL: '左下' },
    hint: '「専用フォント」形式は、<b>ShishikiCross.ttf</b> をインストールしてから使います。<br>・<b>Excel・Word</b>：貼り付けるだけで十字の歯式になります。<br>・<b>PowerPoint・Keynote・Pages・Numbers</b>：貼り付けると英字が並ぶので、その文字を選んでフォントを <b>ShishikiCross</b> に変えてください。<br>使い方：印を選んでから歯を押します（同じ印でもう一度押すと取り消し）。「次の歯式へ」で、続けて別の歯式を並べられます。',
  },
  en: {
    marks: 'Mark:', m0: 'Plain', m1: 'Circle (e.g. bridge abutment)', m2: 'Double circle', m3: 'Circle with vertical line', m4: 'Circle with cross', m5: 'Triangle',
    right: '← Patient right', left: 'Patient left →', chips1: 'Label:', chips2: 'More:', free: 'Custom:', freeph: 'e.g. Crown',
    format: 'Format:', ff: 'Special font, 1 line (cross)', f2: 'Excel 2 lines (underlined top)', f1: 'Text 1 line (65┘└4)', f3: 'Text cross, 3 lines',
    copy: 'Copy', copied: 'Copied', next: 'Next group', clear: 'Clear current teeth and label', allclear: 'Clear all',
    empty: 'Select teeth to see the notation here', lang: '日本語',
    quads: { UR: 'Upper right', UL: 'Upper left', LR: 'Lower right', LL: 'Lower left' },
    hint: 'For the "Special font" format, install <b>ShishikiCross.ttf</b> first.<br>• <b>Excel, Word</b>: just paste.<br>• <b>PowerPoint, Keynote, Pages, Numbers</b>: after pasting you will see Latin letters. Select them and change the font to <b>ShishikiCross</b>.<br>How to use: choose a mark, then click teeth (click again with the same mark to remove). "Next group" lets you add another notation after the current one.',
  },
};
let lang = 'ja';
try {
  const q = new URLSearchParams(location.search).get('lang');
  lang = q || localStorage.getItem('shishiki-lang') || ((navigator.language || 'ja').startsWith('ja') ? 'ja' : 'en');
} catch (_) {}
if (!I18N[lang]) lang = 'ja';
const t = key => I18N[lang][key];

const S = '　';
const fmtSel = () => document.getElementById('fmt').value;
const w = str => Array.from(str).length;
const esc = t => t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

function toothLabel(kind, n) {
  return kind === 'p' ? String(n) : 'ABCDE'[n - 1];
}

// ---- テキスト形式用の文字（全角でそろえる） ----
function token(kind, n, v) {
  const plain = kind === 'p' ? String.fromCharCode(0xFF10 + n) : String.fromCharCode(0xFF21 + n - 1);
  switch (v) {
    case 1: return String.fromCharCode(kind === 'p' ? 0x2460 + n - 1 : 0x24B6 + n - 1);
    case 2: return kind === 'p' ? String.fromCharCode(0x24F5 + n - 1) : '◎' + plain;
    case 3: return '⦶' + plain;
    case 4: return '⊗' + plain;
    case 5: return '△' + plain;
    default: return plain;
  }
}

// ---- 専用フォント用の記号番号（build_font.py と同じ） ----
const N = 67;
// build_font.py が書き込む。[0..66] = 下の記号（横線つき）、[67..132] = 上の記号（幅ゼロ）、[133] = 縦線
const LATIN_CODES = "\u0180\u0181\u0182\u0183\u0184\u0185\u0186\u0187\u0188\u0189\u018a\u018b\u018c\u018d\u018e\u018f\u0190\u0191\u0192\u0193\u0194\u0195\u0196\u0197\u0198\u0199\u019a\u019b\u019c\u019d\u019e\u019f\u01a2\u01a3\u01a4\u01a5\u01a6\u01a7\u01a8\u01a9\u01aa\u01ab\u01ac\u01ad\u01ae\u01b1\u01b2\u01b3\u01b4\u01b5\u01b6\u01b7\u01b8\u01b9\u01ba\u01bb\u01bc\u01bd\u01be\u01bf\u01c0\u01c1\u01c2\u01c3\u01dd\u01e4\u01e5\u01f6\u01f7\u021c\u021d\u0220\u0221\u0222\u0223\u0224\u0225\u0234\u0235\u0236\u0237\u0238\u0239\u023a\u023b\u023c\u023d\u023e\u023f\u0240\u0241\u0242\u0243\u0244\u0245\u0246\u0247\u0248\u0249\u024a\u024b\u024c\u024d\u024e\u024f\u0250\u0251\u0252\u0253\u0254\u0255\u0256\u0257\u0258\u0259\u025a\u025b\u025c\u025d\u025e\u025f\u0260\u0261\u0262\u0263\u0264\u0265\u0266\u0267\u0268\u0269\u026a\u026b\u026c";
const FONT_CSS = ['font-family', 'mso-ascii-font-family', 'mso-hansi-font-family', 'mso-fareast-font-family', 'mso-bidi-font-family']
  .map(k => k + ':ShishikiCross').join(';') + ';mso-no-proof:yes';
function symbols(kind, n, v) {
  const tooth = kind === 'p' ? n - 1 : 8 + n - 1;
  if (v === 5) return [66, 1 + tooth];
  return [1 + v * 13 + tooth];
}

function teeth(st, quad, right) {
  const items = [];
  for (const [k, v] of Object.entries(st)) {
    const [q, kind, n] = k.split('-');
    if (q === quad) items.push({ n: +n, kind, v });
  }
  // 中央から外側へ。同じ位置なら乳歯を中央寄りに
  items.sort((a, b) => a.n - b.n || (a.kind === 'd' ? -1 : 1));
  if (right) items.reverse();
  return items;
}

function fontGroup(st) {
  const side = (q, r) => teeth(st, q, r).flatMap(i => symbols(i.kind, i.n, i.v));
  const ur = side('UR', true), lr = side('LR', true), ul = side('UL', false), ll = side('LL', false);
  if (!ur.length && !lr.length && !ul.length && !ll.length) return null;
  const wR = Math.max(ur.length, lr.length), wL = Math.max(ul.length, ll.length);
  // 1列 = 上の記号（幅ゼロ）+ 下の記号。Office でも英字用フォントとして扱われる文字を使う
  const col = (u, l) => (u ? LATIN_CODES[N + u - 1] : '') + LATIN_CODES[l || 0];
  let str = '';
  for (let i = 0; i < wR; i++) str += col(ur[i - (wR - ur.length)], lr[i - (wR - lr.length)]);
  str += LATIN_CODES[2 * N - 1];
  for (let i = 0; i < wL; i++) str += col(ul[i], ll[i]);
  return str;
}

// テキスト形式：1行なら [文字列]、十字なら [上, 線, 下]
function textGroup(st, fmt) {
  const side = (q, r) => teeth(st, q, r).map(i => token(i.kind, i.n, i.v));
  const ur = side('UR', true), ul = side('UL', false), lr = side('LR', true), ll = side('LL', false);
  const hasU = ur.length || ul.length, hasL = lr.length || ll.length;
  if (!hasU && !hasL) return null;
  if (fmt === '1') {
    const parts = [];
    if (hasU) parts.push(ur.join('') + (ur.length ? '┘' : '') + (ul.length ? '└' : '') + ul.join(''));
    if (hasL) parts.push(lr.join('') + (lr.length ? '┐' : '') + (ll.length ? '┌' : '') + ll.join(''));
    return [parts.join('，')];
  }
  const len = arr => w(arr.join(''));
  const wR = Math.max(len(ur), len(lr)), wL = Math.max(len(ul), len(ll));
  const padL = arr => S.repeat(wR - len(arr)) + arr.join('');
  const padR = arr => arr.join('') + S.repeat(wL - len(arr));
  const center = wR && wL ? '┼' : wR ? '┤' : '├';
  return [padL(ur) + '│' + padR(ul), '─'.repeat(wR) + center + '─'.repeat(wL), padL(lr) + '│' + padR(ll)];
}

function allGroups() {
  const list = groups.slice();
  if (Object.keys(state).length || label) list.push({ state, label });
  return list;
}

// 出力を作る：{ text: プレーンテキスト, html: Excel用, preview: 画面用HTML, font: 専用フォントか }
function buildOutput() {
  const fmt = fmtSel();
  const list = allGroups();
  const br = '<br style="mso-data-placement:same-cell">';
  const parts = [];

  if (fmt === 'f') {
    for (const g of list) {
      const cross = fontGroup(g.state) || '';
      if (!cross && !g.label) continue;
      parts.push({ label: g.label, cross });
    }
    if (!parts.length) return null;
    const text = parts.map(p => (p.label ? p.label + ' ' : '') + p.cross).join('　');
    // 表にせず「フォント指定付きの文字」にする。表だと PowerPoint・Word・Pages・Keynote で表が作られてしまう。
    // Office は英数字用と日本語用のフォントを別に持つので、mso-* で両方に ShishikiCross を指定する
    const html = parts.map(p => (p.label ? '<span>' + esc(p.label) + ' </span>' : '') +
      '<span style="' + FONT_CSS + '">' + p.cross + '</span>').join('<span style="' + FONT_CSS + '">　</span>');
    return { text, html, preview: esc(text), font: true };
  }

  const tfmt = fmt === '1' ? '1' : '3';
  for (const g of list) {
    const lines = textGroup(g.state, tfmt);
    if (!lines && !g.label) continue;
    parts.push({ label: g.label, lines: lines || (tfmt === '1' ? [''] : ['', '', '']) });
  }
  if (!parts.length) return null;

  if (tfmt === '1') {
    const text = parts.map(p => (p.label ? p.label + ' ' : '') + p.lines[0]).join('，');
    return { text, html: '<span>' + esc(text) + '</span>', preview: esc(text) };
  }
  // 十字：ラベルは上の段の前に付け、他の段は全角スペースでそろえる
  const padOf = l => S.repeat(Math.ceil(Array.from(l).reduce((a, c) => a + (c.charCodeAt(0) < 0x2000 ? 0.5 : 1), 0) + (l ? 0.5 : 0)));
  const rows = [[], [], []];
  for (const p of parts) {
    const pad = padOf(p.label || '');
    rows[0].push((p.label ? p.label + ' ' : '') + p.lines[0]);
    rows[1].push(pad + p.lines[1]);
    rows[2].push(pad + p.lines[2]);
  }
  const lines = rows.map(r => r.join(S));
  if (fmt === '3') {
    return { text: lines.join('\n'), html: '<table><tr><td>' + lines.map(esc).join(br) + '</td></tr></table>', preview: esc(lines.join('\n')) };
  }
  // Excel用2行：真ん中の線の代わりに上の段へ下線
  const top = parts.map(p => {
    const lab = p.label ? esc(p.label) + ' ' : '';
    return lab + '<u style="text-decoration:underline">' + esc(p.lines[0].slice(0)) + '</u>';
  }).join(S);
  const bottom = esc(lines[2]);
  return { text: lines.join('\n'), html: '<table><tr><td style="white-space:normal">' + top + br + bottom + '</td></tr></table>', preview: top + '\n' + bottom };
}

function render() {
  const out = document.getElementById('out');
  const o = buildOutput();
  out.classList.toggle('font', !!(o && o.font));
  out.classList.toggle('empty', !o);
  out.innerHTML = o ? o.preview : t('empty');
}

function copy() {
  const o = buildOutput();
  if (!o) return;
  const onCopy = e => {
    e.clipboardData.setData('text/plain', o.text);
    e.clipboardData.setData('text/html', o.html);
    e.preventDefault();
  };
  document.addEventListener('copy', onCopy);
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (_) {}
  document.removeEventListener('copy', onCopy);
  if (!ok && navigator.clipboard) navigator.clipboard.writeText(o.text);
  const b = document.getElementById('copy');
  b.textContent = t('copied');
  b.classList.add('done');
  setTimeout(() => { b.textContent = t('copy'); b.classList.remove('done'); }, 1200);
}

// ---- 画面づくり ----
function paintTooth(b) {
  const [, kind, n] = b.dataset.key.split('-');
  const v = state[b.dataset.key];
  b.classList.toggle('on', v !== undefined);
  b.classList.toggle('mk', v >= 1 && v <= 4);
  b.classList.toggle('tri', v === 5);
  b.textContent = v === undefined || v === 0 ? toothLabel(kind, +n) : token(kind, +n, v).replace(/[０-９Ａ-Ｅ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
}

function makeRow(quad, kind, nums, reverse) {
  const row = document.createElement('div');
  row.className = 'row';
  for (const n of reverse ? [...nums].reverse() : nums) {
    const b = document.createElement('button');
    b.className = 't' + (kind === 'd' ? ' p' : '');
    b.dataset.key = `${quad}-${kind}-${n}`;
    b.dataset.kind = kind; b.dataset.n = n; b.dataset.quad = quad;
    paintTooth(b);
    row.appendChild(b);
  }
  return row;
}

function build() {
  const chart = document.getElementById('chart');
  const side = (cls, rows) => {
    const d = document.createElement('div');
    d.className = 'side ' + cls;
    rows.forEach(r => d.appendChild(r));
    return d;
  };
  const bar = () => { const d = document.createElement('div'); d.className = 'vbar'; return d; };
  // 上顎：永久歯が外側、乳歯が中央寄り
  chart.appendChild(side('r', [makeRow('UR', 'p', PERM, true), makeRow('UR', 'd', PRIM, true)]));
  chart.appendChild(bar());
  chart.appendChild(side('l', [makeRow('UL', 'p', PERM, false), makeRow('UL', 'd', PRIM, false)]));
  const h = document.createElement('div'); h.className = 'hbar'; chart.appendChild(h);
  chart.appendChild(side('r', [makeRow('LR', 'd', PRIM, true), makeRow('LR', 'p', PERM, true)]));
  chart.appendChild(bar());
  chart.appendChild(side('l', [makeRow('LL', 'd', PRIM, false), makeRow('LL', 'p', PERM, false)]));

  chart.addEventListener('click', e => {
    const b = e.target.closest('.t');
    if (!b) return;
    const k = b.dataset.key;
    if (state[k] === mode) delete state[k]; else state[k] = mode;
    paintTooth(b);
    render();
  });

}

function buildChips() {
  ['chips1', 'chips2'].forEach((id, i) => {
    const box = document.getElementById(id);
    box.querySelectorAll('.chip').forEach(c => c.remove());
    for (const word of CHIPS[lang][i]) {
      const c = document.createElement('button');
      c.className = 'chip';
      c.textContent = word;
      c.classList.toggle('active', word === label);
      c.addEventListener('click', () => setLabel(label === word ? '' : word));
      box.appendChild(c);
    }
  });
}

function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-title]').forEach(el => { el.title = t(el.dataset.i18nTitle); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
  document.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = t(el.dataset.i18nHtml); });
  document.querySelectorAll('.t').forEach(b => { b.title = `${t('quads')[b.dataset.quad]} ${toothLabel(b.dataset.kind, +b.dataset.n)}`; });
  document.getElementById('lang').textContent = t('lang');
  buildChips();
  render();
}

function setLabel(t, fromInput) {
  label = t;
  if (!fromInput) document.getElementById('label').value = t;
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.textContent === t));
  render();
}

function clearCurrent() {
  state = {};
  document.querySelectorAll('.t').forEach(paintTooth);
  setLabel('');
}

document.querySelectorAll('.mode').forEach(b => b.addEventListener('click', () => {
  mode = +b.dataset.mode;
  document.querySelectorAll('.mode').forEach(x => x.classList.toggle('active', x === b));
}));
document.getElementById('label').addEventListener('input', e => setLabel(e.target.value.trim(), true));
document.getElementById('copy').addEventListener('click', copy);
document.getElementById('clear').addEventListener('click', clearCurrent);
document.getElementById('allclear').addEventListener('click', () => { groups.length = 0; clearCurrent(); });
document.getElementById('next').addEventListener('click', () => {
  if (!Object.keys(state).length && !label) return;
  groups.push({ state, label });
  clearCurrent();
});
document.getElementById('fmt').addEventListener('change', render);
document.getElementById('lang').addEventListener('click', () => {
  lang = lang === 'ja' ? 'en' : 'ja';
  try { localStorage.setItem('shishiki-lang', lang); } catch (_) {}
  applyLang();
});

build();
applyLang();
</script>
</body>
</html>
